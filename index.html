<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Infographic và video</title>

  <style>
    body {
      margin: 0;
      padding: 2rem 1rem;
      font-family: Arial, sans-serif;
      color: #222;
      background: #f5f7fa;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
    }

    section {
      margin-bottom: 2rem;
      padding: 1.5rem;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 10px rgb(0 0 0 / 8%);
    }

    img,
    video {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <main>
    <section>
      <h1>Infographic</h1>
      <figure>
        <img
          src="Images/2aOboR5sUhWb8Vc6lJ3G2z19PNLWzZvIRrHJnhfU.jpg"
          alt="Infographic tóm tắt các thông tin chính"
        >
        <figcaption>Tóm tắt các thông tin chính.</figcaption>
      </figure>
    </section>

    <section>
      <h2>Video giới thiệu</h2>
        <source src="videos/2HGb6FGybhUKupnoLJc4Y9mCocMQXGHaNuLY.mp4" type="video/mp4">
        Trình duyệt của bạn không hỗ trợ phát video.
      </video>
    </section>
  </main>
</body>
</html>
