<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Infographic và video</title>

  <style>
    body {
      margin: 0;
      padding: 2rem 1rem;
      font-family: Arial, sans-serif;
      color: #222;
      background: #f5f7fa;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
    }

    section {
      margin-bottom: 2rem;
      padding: 1.5rem;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 10px rgb(0 0 0 / 8%);
    }

    iframe {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 8px;
    }

    .image-frame {
      height: 650px;
    }

    .video-frame {
      aspect-ratio: 16 / 9;
    }
  </style>
</head>
<body>
  <main>
    <section>
      <h1>Infographic</h1>
      <iframe
        class="image-frame"
        src="c:\Users\PC\Downloads\2aOboR5sUhWb8Vc6lJ3G2z19PNLWzZvIRrHJnhfU.jpg"
        title="Infographic"
        loading="lazy">
      </iframe>
    </section>

    <section>
      <h2>Video giới thiệu</h2>
      <iframe
        class="video-frame"
        src="c:\Users\PC\Downloads\2HGb6FGybhUKupnoLJc4Y9mCocMQXGHaNuLY.mp4"
        title="Video giới thiệu"
        loading="lazy"
        allow="fullscreen">
      </iframe>
    </section>
  </main>
</body>
</html>
